name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true
        default: "0.4.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve and verify version
        id: version
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use x.y.z format. Received: $version"
          }
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($version -ne $projectVersion) {
            throw "Requested version $version does not match pyproject.toml version $projectVersion."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install application and test dependencies
        run: python -m pip install -e .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: .\packaging\build-windows.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create checksum
        id: files
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "release\Wordwright-Setup-$version.exe"
          $checksum = "$installer.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath $checksum -Encoding ascii
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wordwright-Setup-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.files.outputs.installer }}
            ${{ steps.files.outputs.checksum }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "${{ steps.files.outputs.installer }}" `
            "${{ steps.files.outputs.checksum }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Wordwright $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
